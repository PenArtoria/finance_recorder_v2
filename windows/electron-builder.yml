appId: com.nestegg.app
productName: Nest Egg
copyright: Copyright © 2026 Moneta contributors
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Nest-Egg-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nest Egg
  uninstallDisplayName: Nest Egg
  deleteAppDataOnUninstall: false
