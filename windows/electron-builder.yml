# Kept from the Nest Egg release so installing Moneta upgrades it instead of adding a second app.
appId: com.nestegg.app
productName: Moneta
copyright: Copyright © 2026 Moneta contributors
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Moneta-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Moneta
  uninstallDisplayName: Moneta
  deleteAppDataOnUninstall: false
